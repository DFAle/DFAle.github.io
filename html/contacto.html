<body>

    <nav>   
      <ul>

            <button  id="toggle-tema" style="padding: 10px; border-radius: 8px; cursor: pointer;">

          <li><a class="link" href="/index.html">INICIO</a> </li>

          <li></li>

          <li><a class="link"  href="../html/entrenadores.html">ENTRENADORES</a></li>
            
          <li><a class="link"  href="../html/precios.html">PRECIOS</a></li>
            
          <li><a class="link"  href="../html/blog.html">BLOG</a></li>

              <ul class="sub-menu">

                  <li><a href="#">Zumba</a></li>

            <li><a class="link"  href="../html/contacto.html">CONTACTO</a></li>
        </ul>
    </nav>
  </header>
    <br><br><br>
    <main class="form-container">
        <h2 class="tit-form" >Formulario de Contacto</h2>
    
        <!-- El checkbox está fuera del form, pero sigue dentro de <main> -->
        <input type="checkbox" id="toggleModal" class="hidden" />
    
        <form id="formularioContacto">
          <label>
            Nombre:
            <input type="text" name="nombre" required  placeholder="Su Nombre" />
          </label  >
          <label>
            Apellido:
            <input type="text" name="nombre" required  placeholder="Su Apellido" />
          </label>
          <label>
            Email:
            <input type="email" name="email" required  placeholder="tugmail@gmail.com"/>
          </label>
          <label>
            <label>
                Telefono:
                <input type="number" name="telefono" required  placeholder="+54 123456789" />
              </label><br><br>
              Mensaje:
            <textarea name="mensaje" required  placeholder="Ingresa tu Mensaje" ></textarea>
          </label>
    
          
          <label for="toggleModal" class="btn-enviar">Enviar</label>
          
            
          <div class="spinner"></div>
        </form>
        <div class="modal">
          <div class="modal-content">
            <label for="toggleModal" class="cerrar">✖</label>
            <p>¡Formulario enviado correctamente!</p>
          </div>
        </div>
    </main>
    <br><br><br><br><br>
    <footer >
        <div class="social-iconos">
            <i class="bi bi-instagram"><a class="social-icono-text" href="#">Instagram</a></i>
            <i class="bi bi-facebook"><a class="social-icono-text" href="#">Facebook</a></i>
            <i class="bi bi-whatsapp"><a class="social-icono-text" href="#">WhatsApp</a></i>
            <i class="bi bi-twitter"><a class="social-icono-text" href="#">Twitter</a></i>
        </div>

        <div class="cont-inf">
            <div class="cont-inf-text">
                CONTACTANOS 
                <p>Alejandro Cuellar</p>
                <p>thealecuellar@gmail.com</p>
            </div>
        </div>
    </footer>
    <script>
      const btn = document.getElementById('toggle-tema');
      const icono = document.getElementById('icono');
    
      btn.addEventListener('click', () => {
      document.body.classList.toggle('modo-oscuro');
    
      // Cambiar ícono
      if (document.body.classList.contains('modo-oscuro')) {
          icono.textContent = '☀️'; 
      } else {
        icono.textContent = '🌙'; 
        }
      });
    </script>
</body>
